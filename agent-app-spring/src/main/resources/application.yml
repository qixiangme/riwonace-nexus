server:
  port: 8080

spring:
  application:
    name: riwonace-agent
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # 지정과제 권장 모델 Gemma 4 E2B(~2.3B effective). 사양별 교체는 환경변수 하나로:
          # OLLAMA_MODEL=gemma4:e2b-it-qat | gemma3:1b | qwen2.5:3b | qwen2.5:7b
          model: ${OLLAMA_MODEL:gemma4:e2b-it-qat}
          # 사실 질의 시스템에는 결정적 생성이 유리 — 같은 질문에 같은 답 (재현성)
          temperature: 0.0
          # temperature=0이어도 seed 없이는 Ollama가 매 요청 다른 난수 상태로 샘플링해
          # 출력 토큰 수(=CPU 추론 지연시간)가 크게 요동친다 — 고정 seed로 완전한 결정성 확보
          seed: 42
          # KV 캐시 메모리 절감 — TACC 예산(2,400자)이 이 안에 들어오도록 설계됨
          num-ctx: 4096
          # Gemma 4 E2B는 reasoning 모델이라 thinking에 토큰을 먼저 소모한다 —
          # 512로는 thinking만 하다 답변 전에 잘려 1024로 올렸다(실측으로 확인).
          max-tokens: ${OLLAMA_MAX_TOKENS:1024}
      embedding:
        options:
          # EmbeddingRouteFallback이 라우팅용으로만 사용 — mcp-server의 문서 임베딩과는 별개 호출
          model: nomic-embed-text
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 120s
        toolcallback:
          enabled: false
        sse:
          connections:
            riwonace:
              # MCP 서버 교체는 환경변수 하나 — Spring AI 서버(8081) ↔ air 서버(8082)
              url: ${MCP_SERVER_URL:http://localhost:8081}

agent:
  # Architecture v2 활성화 (true=새 파이프라인, false=기존 호환)
  v2:
    enabled: ${AGENT_V2_ENABLED:true}
  context:
    budget-chars: 2400
  evaluation:
    # 제출용 ablation에서만 변경한다. 운영 기본값은 OURS/CURRENT이며 evidence 본문은 비공개다.
    mode: ${EVALUATION_MODE:OURS}
    context-policy: ${CONTEXT_POLICY:CURRENT}
    include-evidence: ${EVALUATION_INCLUDE_EVIDENCE:false}
    fault:
      enabled: ${EVALUATION_FAULT_ENABLED:false}
      routes: ${EVALUATION_FAULT_ROUTES:}
      mode: ${EVALUATION_FAULT_MODE:EXCEPTION}
  router:
    # 키워드 미매칭 시 폴백 전략: 빈 값(기본)=VECTOR, tfidf=로컬 k-NN,
    # embedding=코사인, ai=기존 3-shot 분류,
    # semantic-ai=데이터 형태·연산 경계를 명시한 의미 분류
    fallback: ${ROUTER_FALLBACK:}
  # Adaptive Model Escalation 설정. Gemma 4 E2B 단일 모델 실측(302문항)에서
  # 에스컬레이션 없이 답변 정확도 93.0%를 냈고, gemma3:1b 세대에서 에스컬레이션으로
  # 보완하던 격차(73.8%)가 모델 자체 성능으로 해소되어 기본값을 off로 바꿨다.
  # 더 작은 모델(gemma3:1b 등)로 되돌릴 계획이면 true로 켜는 것을 권장한다.
  escalation:
    enabled: ${MODEL_ESCALATION_ENABLED:false}
    models:
      small: ${MODEL_SMALL:gemma4:e2b-it-qat}
      medium: ${MODEL_MEDIUM:qwen2.5:3b}
      large: ${MODEL_LARGE:qwen2.5:7b}
  # Answerability Gate 설정
  answerability:
    coverage-threshold: ${COVERAGE_THRESHOLD:0.7}
    use-llm: ${ANSWERABILITY_USE_LLM:false}

logging:
  level:
    com.riwonace: INFO
