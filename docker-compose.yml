# agent-app/mcp-server를 이후 컨테이너화할 때 리소스 limit을 정하려면
# docs/architecture/ALTERNATIVE_IMPLEMENTATIONS.md의 실측 peak RSS를 기준으로
# 삼는다: Spring AI 스택 487MB, AIR 스택 294MB, Go 스택 43MB (100문항, 소규모
# Company-X 시드 데이터 기준). 대용량 데이터 환경에서는 이 수치가 달라질 수
# 있으니 그때는 재측정 후 갱신한다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: riwonace-postgres
    environment:
      POSTGRES_DB: riwonace
      POSTGRES_USER: riwonace
      POSTGRES_PASSWORD: riwonace
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riwonace -d riwonace"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: riwonace-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # 모델 상주 — 5분 유휴 언로드로 인한 콜드 스타트(~45초) 제거
      OLLAMA_KEEP_ALIVE: "-1"
      # KV 캐시 절반 절감(체감 손실 거의 없음) + Flash Attention
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_FLASH_ATTENTION: "1"

volumes:
  pgdata:
  ollama:
