name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/keywordless-routing

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle wrapper 실행 권한 확인
        run: test -x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile eval/*.py
      - run: python -m unittest discover -s eval -p 'test_*.py'
      - run: python eval/check-keyword-gap.py eval/keyword-gap-eval.json

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_markdown_links.py
